[project]
name = "mfpipeline"
version = "0.1.0"
description = "Mutual fund NAV analytics pipeline: AMFI -> S3 lake -> Spark -> Postgres/dbt -> API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
