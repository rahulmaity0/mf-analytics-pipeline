global:
  scrape_interval: 15s

scrape_configs:
  # Batch jobs push their metrics here; honor_labels keeps the job/stage labels they set.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: api
    static_configs:
      - targets: ["api:8000"]
